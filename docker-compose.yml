services:
  db:
    image: postgres:16-alpine
    container_name: hesabu_db
    environment:
      POSTGRES_DB: hesabu
      POSTGRES_USER: hesabu_user
      POSTGRES_PASSWORD: hesabu_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesabu_user -d hesabu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hesabu_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
