# Client IP: the only thing that can reach this container is our own
# cloudflared connector (no published host ports), and Cloudflare's edge always
# overwrites CF-Connecting-IP with the real client address — so trust it from
# the compose network only, and forward exactly that one IP to Django
# (overwriting, not appending, so a client-supplied X-Forwarded-For can't be
# smuggled through). The M-Pesa callback allowlist (apps/core/decorators.py)
# and DRF throttling both key off the X-Forwarded-For this sends.
set_real_ip_from 172.30.0.0/24;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # React Router (history mode) SPA fallback. Everything here (index.html,
    # sw.js, registerSW.js, the manifest, icons) keeps a stable URL across
    # deploys, so it must be revalidated on every load; no-cache also stops
    # Cloudflare's edge from caching it, which delayed service-worker updates.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Vite's build output: content-hashed file names, so safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest (it went out as
    # application/octet-stream).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://hesabu-backend-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /admin/ {
        proxy_pass http://hesabu-backend-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Django admin's own static assets (whitenoise, served from within gunicorn).
    # The React app's own built assets are served directly from / above.
    location /static/ {
        proxy_pass http://hesabu-backend-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Served from a volume shared with the backend container, not proxied —
    # django.conf.urls.static.static() is a no-op once DEBUG=False.
    location /media/ {
        alias /usr/share/nginx/media/;
    }
}
